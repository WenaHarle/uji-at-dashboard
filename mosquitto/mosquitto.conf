per_listener_settings false
allow_anonymous false

# Akun & izin dikelola app lewat $CONTROL/dynamic-security (akun per tamu, topik terisolasi)
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Listener internal untuk app (pemantau + admin dynsec)
listener 1883
protocol mqtt

# MQTT over WebSocket, diteruskan app dari https://ujiat.madewena.com/mqtt
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest topic
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
max_packet_size 1048576
